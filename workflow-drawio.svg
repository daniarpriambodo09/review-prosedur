<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1080" width="1560" height="1080">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; text-anchor: middle; }
      
      /* Swimlane Headers */
      .lane-hdr-text { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; }
      
      /* Standard Nodes */
      .node-text { font-size: 11px; fill: #0f172a; text-anchor: middle; }
      .node-title { font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .edge-label { font-size: 10px; font-weight: 700; fill: #334155; }
      
      /* Connectors */
      .edge { fill: none; stroke-width: 1.5; }
      .edge-blue { stroke: #0284c7; }
      .edge-purple { stroke: #7e22ce; }
      .edge-green { stroke: #16a34a; }
      .edge-red { stroke: #dc2626; stroke-dasharray: 4,4; }
    </style>

    <!-- Arrowheads -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7e22ce" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Canvas Background (Draw.io White with faint paper grid) -->
  <rect width="1560" height="1080" fill="#ffffff" />
  <pattern id="paper-grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1" />
  </pattern>
  <rect width="1560" height="1080" fill="url(#paper-grid)" />

  <!-- HEADER -->
  <text x="780" y="38" class="title">FLOWCHART WORKFLOW SISTEM REVIEW PROSEDUR (QMS)</text>
  <text x="780" y="58" class="subtitle">Standard Operating Workflow &amp; Approval Matrix (Draw.io Flowchart Standard)</text>

  <!-- ======================================================== -->
  <!-- SWIMLANE 1: PIC / MONITORING                             -->
  <!-- ======================================================== -->
  <g transform="translate(40, 80)">
    <!-- Lane container -->
    <rect width="450" height="960" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
    <!-- Header banner -->
    <rect width="450" height="36" fill="#0284c7" />
    <text x="225" y="23" class="lane-hdr-text" fill="#ffffff" text-anchor="middle">FASE 1: MONITORING &amp; REVIEW BERKALA (PIC)</text>

    <!-- Start Terminal -->
    <rect x="145" y="55" width="160" height="38" rx="19" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <text x="225" y="79" class="node-title" fill="#0369a1">Mulai Siklus Tahunan</text>

    <path d="M 225 93 L 225 125" class="edge edge-blue" marker-end="arr-blue" />

    <!-- Cron Scheduler -->
    <rect x="110" y="125" width="230" height="48" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
    <text x="225" y="146" class="node-title">1.1 Background Scheduler</text>
    <text x="225" y="161" class="node-text" fill="#475569">Python APScheduler cek jatuh tempo</text>

    <path d="M 225 173 L 225 205" class="edge edge-blue" marker-end="arr-blue" />

    <!-- Email Reminder -->
    <rect x="110" y="205" width="230" height="48" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
    <text x="225" y="226" class="node-title">1.2 Notifikasi Email Reminder</text>
    <text x="225" y="241" class="node-text" fill="#475569">Kirim email pengingat review ke PIC</text>

    <path d="M 225 253 L 225 285" class="edge edge-blue" marker-end="arr-blue" />

    <!-- PIC Login & Review -->
    <rect x="110" y="285" width="230" height="52" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
    <text x="225" y="306" class="node-title">1.3 PIC Review Dokumen</text>
    <text x="225" y="323" class="node-text" fill="#475569">Login Dashboard &amp; Buka PDF Viewer</text>

    <path d="M 225 337 L 225 370" class="edge edge-blue" marker-end="arr-blue" />

    <!-- Decision Diamond -->
    <polygon points="225,370 310,410 225,450 140,410" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="225" y="407" class="node-title" fill="#92400e">Evaluasi PIC?</text>
    <text x="225" y="420" font-size="9" fill="#b45309" text-anchor="middle">Pilih Status</text>

    <!-- Branch: Relevan (Left) -->
    <path d="M 140 410 L 80 410 L 80 475" class="edge edge-green" marker-end="arr-green" />
    <text x="85" y="440" class="edge-label" fill="#16a34a">Relevan</text>
    <rect x="20" y="475" width="120" height="48" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" />
    <text x="80" y="496" class="node-title" fill="#166534">Tetap Relevan</text>
    <text x="80" y="511" class="node-text" fill="#15803d">Perpanjang masa</text>

    <!-- Branch: Obsolete (Right) -->
    <path d="M 310 410 L 370 410 L 370 475" class="edge edge-red" marker-end="arr-red" />
    <text x="325" y="440" class="edge-label" fill="#dc2626">Obsolete</text>
    <rect x="310" y="475" width="120" height="48" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" />
    <text x="370" y="496" class="node-title" fill="#991b1b">Obsolete</text>
    <text x="370" y="511" class="node-text" fill="#b91c1c">Masuk Arsip</text>

    <!-- Branch: Perlu Revisi (Center Down) -->
    <path d="M 225 450 L 225 565" class="edge edge-blue" marker-end="arr-blue" />
    <rect x="180" y="495" width="90" height="20" fill="#ffffff" stroke="#ca8a04" stroke-width="1" />
    <text x="225" y="509" font-size="10" font-weight="700" fill="#a16207" text-anchor="middle">Perlu Revisi</text>

    <!-- Revisi Draf Baru -->
    <rect x="110" y="565" width="230" height="54" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" />
    <text x="225" y="587" class="node-title" fill="#854d0e">1.4 Upload Draf Revisi Baru</text>
    <text x="225" y="604" class="node-text" fill="#713f12">PIC unggah PDF draf &amp; isi catatan</text>

    <path d="M 225 619 L 225 655" class="edge edge-blue" marker-end="arr-blue" />

    <!-- Submit Request -->
    <rect x="110" y="655" width="230" height="48" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
    <text x="225" y="676" class="node-title">1.5 Kirim Request ke Admin</text>
    <text x="225" y="691" class="node-text" fill="#475569">Status: Menunggu Setup Admin</text>
  </g>

  <!-- ======================================================== -->
  <!-- SWIMLANE 2: ADMIN & APPROVAL MATRIX                      -->
  <!-- ======================================================== -->
  <g transform="translate(530, 80)">
    <rect width="500" height="960" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5" />
    <rect width="500" height="36" fill="#7e22ce" />
    <text x="250" y="23" class="lane-hdr-text" fill="#ffffff" text-anchor="middle">FASE 2: MATRIKS APPROVAL BERJENJANG (APPROVAL MATRIX)</text>

    <!-- Admin Setup -->
    <rect x="135" y="55" width="230" height="50" fill="#ffffff" stroke="#7e22ce" stroke-width="1.2" />
    <text x="250" y="76" class="node-title">2.1 Admin Atur Approver</text>
    <text x="250" y="93" class="node-text" fill="#475569">Tetapkan matriks &amp; upload file final</text>

    <path d="M 250 105 L 250 135" class="edge edge-purple" marker-end="arr-purple" />

    <!-- Inisiasi Approval -->
    <rect x="135" y="135" width="230" height="50" fill="#ffffff" stroke="#7e22ce" stroke-width="1.2" />
    <text x="250" y="156" class="node-title">2.2 Inisiasi Siklus Approval</text>
    <text x="250" y="173" class="node-text" fill="#475569">Generate secure token link per stage</text>

    <path d="M 250 185 L 250 215" class="edge edge-purple" marker-end="arr-purple" />

    <!-- Stage 1: Prepared -->
    <rect x="135" y="215" width="230" height="52" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5" />
    <text x="250" y="236" class="node-title" fill="#581c87">Approver 1: PREPARED</text>
    <text x="250" y="253" class="node-text" fill="#6b21a8">Review draf teknis via /acc/[token]</text>

    <path d="M 250 267 L 250 295" class="edge edge-purple" marker-end="arr-purple" />

    <!-- Decision 1 -->
    <polygon points="250,295 330,330 250,365 170,330" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="250" y="334" class="node-title" fill="#92400e">Prepared?</text>

    <path d="M 250 365 L 250 405" class="edge edge-green" marker-end="arr-green" />
    <text x="256" y="385" class="edge-label" fill="#16a34a">ACC</text>

    <!-- Stage 2: Checked -->
    <rect x="135" y="405" width="230" height="52" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5" />
    <text x="250" y="426" class="node-title" fill="#581c87">Approver 2: CHECKED</text>
    <text x="250" y="443" class="node-text" fill="#6b21a8">Pemeriksaan cross-dept / QMS</text>

    <path d="M 250 457 L 250 485" class="edge edge-purple" marker-end="arr-purple" />

    <!-- Decision 2 -->
    <polygon points="250,485 330,520 250,555 170,520" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="250" y="524" class="node-title" fill="#92400e">Checked?</text>

    <path d="M 250 555 L 250 595" class="edge edge-green" marker-end="arr-green" />
    <text x="256" y="575" class="edge-label" fill="#16a34a">ACC</text>

    <!-- Stage 3: Approved -->
    <rect x="135" y="595" width="230" height="52" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5" />
    <text x="250" y="616" class="node-title" fill="#581c87">Approver 3: APPROVED</text>
    <text x="250" y="633" class="node-text" fill="#6b21a8">Pengesahan Top Management</text>

    <path d="M 250 647 L 250 675" class="edge edge-purple" marker-end="arr-purple" />

    <!-- Decision 3 -->
    <polygon points="250,675 330,710 250,745 170,710" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="250" y="714" class="node-title" fill="#92400e">Approved?</text>

    <!-- Rejection Collector Node -->
    <rect x="135" y="800" width="230" height="52" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="250" y="822" class="node-title" fill="#991b1b">Ditolak (Reject / Revisi)</text>
    <text x="250" y="839" class="node-text" fill="#b91c1c">Siklus reset + catatan revisi ke PIC</text>

    <!-- Rejection Lines from all 3 decisions -->
    <path d="M 330 330 L 420 330 L 420 815 L 365 815" class="edge edge-red" marker-end="arr-red" />
    <text x="350" y="325" class="edge-label" fill="#dc2626">Tolak</text>

    <path d="M 330 520 L 400 520 L 400 826 L 365 826" class="edge edge-red" marker-end="arr-red" />
    <text x="350" y="515" class="edge-label" fill="#dc2626">Tolak</text>

    <path d="M 330 710 L 380 710 L 380 838 L 365 838" class="edge edge-red" marker-end="arr-red" />
    <text x="345" y="705" class="edge-label" fill="#dc2626">Tolak</text>
  </g>

  <!-- ======================================================== -->
  <!-- SWIMLANE 3: FINALISASI & VERIFIKASI                      -->
  <!-- ======================================================== -->
  <g transform="translate(1070, 80)">
    <rect width="450" height="960" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <rect width="450" height="36" fill="#16a34a" />
    <text x="225" y="23" class="lane-hdr-text" fill="#ffffff" text-anchor="middle">FASE 3: STEMPEL &amp; VERIFIKASI DOKUMEN</text>

    <!-- Completed Node -->
    <rect x="110" y="215" width="230" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="225" y="236" class="node-title" fill="#166534">Approval Selesai (Completed)</text>
    <text x="225" y="253" class="node-text" fill="#15803d">Seluruh approver telah ACC</text>

    <path d="M 225 265 L 225 305" class="edge edge-green" marker-end="arr-green" />

    <!-- Date Stamping -->
    <rect x="110" y="305" width="230" height="50" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" />
    <text x="225" y="326" class="node-title">3.1 Date Stamping</text>
    <text x="225" y="343" class="node-text" fill="#475569">Tetapkan tanggal selesai approval</text>

    <path d="M 225 355 L 225 395" class="edge edge-green" marker-end="arr-green" />

    <!-- QR Embedding -->
    <rect x="110" y="395" width="230" height="50" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" />
    <text x="225" y="416" class="node-title">3.2 Generate QR &amp; Terbitkan PDF</text>
    <text x="225" y="433" class="node-text" fill="#475569">Dokumen sah baru aktif di server</text>

    <path d="M 225 445 L 225 485" class="edge edge-green" marker-end="arr-green" />

    <!-- Archive -->
    <rect x="110" y="485" width="230" height="50" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" />
    <text x="225" y="506" class="node-title">3.3 Arsip Dokumen Lama</text>
    <text x="225" y="523" class="node-text" fill="#475569">Otomatis dipindahkan ke arsip_prosedur</text>

    <path d="M 225 535 L 225 575" class="edge edge-green" marker-end="arr-green" />

    <!-- Public QR Verification Portal -->
    <rect x="95" y="575" width="260" height="65" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="225" y="598" class="node-title" fill="#166534">3.4 Portal Verifikasi QR Publik</text>
    <text x="225" y="615" class="node-text" fill="#0284c7" font-weight="700">/verify/[code]</text>
    <text x="225" y="630" class="node-text" fill="#15803d">Auditor / User scan QR tanpa login</text>

    <path d="M 225 640 L 225 685" class="edge edge-green" marker-end="arr-green" />

    <!-- Next Cycle Terminal -->
    <rect x="125" y="685" width="200" height="42" rx="21" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <text x="225" y="703" class="node-title" fill="#0369a1">Selesai &amp; Jadwalkan Ulang</text>
    <text x="225" y="718" font-size="10" fill="#0284c7" text-anchor="middle">Siklus review berkala tahun depan</text>
  </g>

  <!-- ======================================================== -->
  <!-- CROSS-SWIMLANE INTERACTION EDGES                         -->
  <!-- ======================================================== -->

  <!-- Lane 1 (1.5 Request) to Lane 2 (2.1 Admin Setup) -->
  <path d="M 340 760 L 510 760 L 510 160 L 665 160" class="edge edge-blue" stroke-width="2" marker-end="arr-blue" />
  <rect x="445" y="440" width="130" height="22" fill="#ffffff" stroke="#0284c7" stroke-width="1" />
  <text x="510" y="455" font-size="10" font-weight="700" fill="#0284c7" text-anchor="middle">Pengajuan Dokumen</text>

  <!-- Lane 2 (Stage 3 Approved) to Lane 3 (Completed) -->
  <path d="M 860 790 L 1050 790 L 1050 320 L 1180 320" class="edge edge-green" stroke-width="2" marker-end="arr-green" />
  <rect x="990" y="530" width="120" height="22" fill="#ffffff" stroke="#16a34a" stroke-width="1" />
  <text x="1050" y="545" font-size="10" font-weight="700" fill="#16a34a" text-anchor="middle">Semua Stage ACC</text>

  <!-- Lane 2 (Rejected) Loop back to Lane 1 (1.4 Revisi) -->
  <path d="M 665 910 L 265 910 L 265 700" class="edge edge-red" stroke-width="2" marker-end="arr-red" />
  <rect x="400" y="900" width="160" height="20" fill="#ffffff" stroke="#dc2626" stroke-width="1" />
  <text x="480" y="914" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">Reset Siklus &amp; Revisi Draf</text>

  <!-- FOOTER LEGEND (Standard Flowchart Symbols) -->
  <g transform="translate(40, 1050)">
    <rect x="0" y="0" width="16" height="16" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" />
    <text x="24" y="12" font-size="11" fill="#475569">Start / End</text>

    <rect x="120" y="0" width="20" height="16" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
    <text x="148" y="12" font-size="11" fill="#475569">Proses / Aktivitas</text>

    <polygon points="260,8 270,0 280,8 270,16" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" />
    <text x="288" y="12" font-size="11" fill="#475569">Keputusan (Decision)</text>

    <rect x="440" y="0" width="20" height="16" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" />
    <text x="468" y="12" font-size="11" fill="#475569">Penolakan / Obsolete</text>

    <rect x="620" y="0" width="20" height="16" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2" />
    <text x="648" y="12" font-size="11" fill="#475569">Disetujui (ACC) / Terbit</text>

    <text x="1480" y="12" font-size="11" fill="#94a3b8" text-anchor="end">Dapat diedit di app.diagrams.net (.drawio)</text>
  </g>
</svg>
