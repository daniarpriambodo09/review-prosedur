  <!-- SECURITY & QUALITY LAYER -->
  <g id="security">
    <!-- Category Header -->
    <rect x="1040" y="410" width="310" height="35" class="security-bg" rx="5"/>
    <text x="1195" y="435" text-anchor="middle" class="category-title">SECURITY & QUALITY</text>
    
    <!-- Session Management -->
    <rect x="1040" y="460" width="150" height="110" class="security-bg category-box" rx="5"/>
    <text x="1115" y="485" text-anchor="middle" class="tech-name">Session Management</text>
    <text x="1115" y="503" text-anchor="middle" class="tech-desc">User Sessions,</text>
    <text x="1115" y="518" text-anchor="middle" class="tech-desc">Authentication</text>
    <text x="1115" y="533" text-anchor="middle" class="tech-desc">Token-based</text>
    <text x="1115" y="547" text-anchor="middle" class="tech-desc">Auth Flow</text>
    
    <!-- OTP Verification -->
    <rect x="1210" y="460" width="140" height="110" class="security-bg category-box" rx="5"/>
    <text x="1280" y="485" text-anchor="middle" class="tech-name">OTP Verification</text>
    <text x="1280" y="503" text-anchor="middle" class="tech-desc">Two-Factor</text>
    <text x="1280" y="518" text-anchor="middle" class="tech-desc">Authentication,</text>
    <text x="1280" y="533" text-anchor="middle" class="tech-desc">Email OTP,</text>
    <text x="1280" y="547" text-anchor="middle" class="tech-desc">Security Layer</text>
  </g>
  
  <!-- Summary Section -->
  <g id="summary">
    <rect x="50" y="410" width="940" height="210" fill="#f0f4f8" stroke="#2c5282" stroke-width="1" rx="5"/>
    
    <text x="70" y="435" class="tech-name" font-size="14">FITUR UTAMA SISTEM:</text>
    
    <text x="70" y="460" class="tech-desc">✓ Full-Stack Web Application: Frontend React components berkomunikasi dengan Next.js API Routes</text>
    <text x="70" y="480" class="tech-desc">✓ Type-Safe Development: TypeScript memastikan kualitas kode dan mengurangi bugs</text>
    <text x="70" y="500" class="tech-desc">✓ Database Persistence: PostgreSQL menyimpan semua data dokumen, review, dan aktivitas</text>
    <text x="70" y="520" class="tech-desc">✓ Security: bcryptjs untuk password hashing, session management, dan OTP verification</text>
    <text x="70" y="540" class="tech-desc">✓ File Management: Upload, download, versioning, dan archiving dokumen dengan metadata lengkap</text>
    <text x="70" y="560" class="tech-desc">✓ Audit Trail: Semua aktivitas user dicatat di Activities table untuk compliance dan tracking</text>
    <text x="70" y="580" class="tech-desc">✓ Notification System: Email dan in-app notifications untuk updates dokumen dan review status</text>
    <text x="70" y="600" class="tech-desc">✓ Responsive UI: Tailwind CSS memastikan aplikasi responsif dan user-friendly di semua device</text>
  </g>
  
  <!-- Architecture Pattern Info -->
  <g id="pattern">
    <rect x="50" y="630" width="1300" height="180" fill="#fef5e7" stroke="#f39c12" stroke-width="1" opacity="0.9" rx="5"/>
    
    <text x="70" y="655" class="tech-name" font-size="14">ARSITEKTUR PATTERN & BEST PRACTICES:</text>
    
    <text x="70" y="680" class="tech-desc">• Server-Side Rendering (SSR) & Client-Side Rendering (CSR): Next.js mengoptimalkan performa dengan SSR untuk SEO dan CSR untuk interaktivitas</text>
    <text x="70" y="700" class="tech-desc">• API Layer Separation: API Routes terpisah dari component logic untuk separation of concerns dan reusability</text>
    <text x="70" y="720" class="tech-desc">• Component Composition: React components dikomposisi menjadi smaller, reusable pieces untuk maintainability</text>
    <text x="70" y="740" class="tech-desc">• Database Transactions: PostgreSQL memastikan data consistency dan ACID compliance untuk operasi kritis</text>
    <text x="70" y="760" class="tech-desc">• Error Handling & Logging: Comprehensive error handling dan activity logging untuk debugging dan audit trail</text>
    <text x="70" y="780" class="tech-desc">• Responsive Design: Tailwind CSS utility-first approach memastikan konsistensi dan responsive design di semua viewport</text>
  </g>
</svg>
