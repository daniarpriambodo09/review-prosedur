    <rect x="1280" y="125" width="70" height="110" class="tools-bg category-box" rx="5"/>
    <text x="1315" y="150" text-anchor="middle" class="tech-name">date-fns</text>
    <text x="1315" y="168" text-anchor="middle" class="tech-desc">Date Format</text>
    <text x="1315" y="183" text-anchor="middle" class="tech-desc">Manipulation,</text>
    <text x="1315" y="197" text-anchor="middle" class="tech-desc">Utilities</text>
    <text x="1315" y="211" text-anchor="middle" class="tech-desc">Parsing</text>
    
    <!-- Build & Dev Tools -->
    <rect x="1040" y="255" width="100" height="110" class="tools-bg category-box" rx="5"/>
    <text x="1090" y="280" text-anchor="middle" class="tech-name">npm/pnpm</text>
    <text x="1090" y="298" text-anchor="middle" class="tech-desc">Package Manager</text>
    <text x="1090" y="313" text-anchor="middle" class="tech-desc">Dependency</text>
    <text x="1090" y="328" text-anchor="middle" class="tech-desc">Management</text>
    <text x="1090" y="342" text-anchor="middle" class="tech-desc">Scripts</text>
    
    <!-- Git -->
    <rect x="1160" y="255" width="100" height="110" class="tools-bg category-box" rx="5"/>
    <text x="1210" y="280" text-anchor="middle" class="tech-name">Git/GitHub</text>
    <text x="1210" y="298" text-anchor="middle" class="tech-desc">Version Control</text>
    <text x="1210" y="313" text-anchor="middle" class="tech-desc">Collaboration,</text>
    <text x="1210" y="328" text-anchor="middle" class="tech-desc">Code Hosting</text>
    <text x="1210" y="342" text-anchor="middle" class="tech-desc">CI/CD</text>
    
    <!-- Documentation -->
    <rect x="1280" y="255" width="70" height="110" class="tools-bg category-box" rx="5"/>
    <text x="1315" y="280" text-anchor="middle" class="tech-name">Docs</text>
    <text x="1315" y="298" text-anchor="middle" class="tech-desc">README, API</text>
    <text x="1315" y="313" text-anchor="middle" class="tech-desc">Docs, Code</text>
    <text x="1315" y="328" text-anchor="middle" class="tech-desc">Comments</text>
    <text x="1315" y="342" text-anchor="middle" class="tech-desc">JSDoc</text>
