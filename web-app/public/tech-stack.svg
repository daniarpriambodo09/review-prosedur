    <text x="445" y="150" text-anchor="middle" class="tech-name">Node.js</text>
    <text x="445" y="168" text-anchor="middle" class="tech-desc">JavaScript</text>
    <text x="445" y="183" text-anchor="middle" class="tech-desc">Runtime Environment</text>
    <text x="445" y="197" text-anchor="middle" class="tech-desc">for Backend Logic</text>
    <text x="445" y="211" text-anchor="middle" class="tech-desc">Execution</text>
    
    <!-- Express-like APIs -->
    <rect x="530" y="125" width="130" height="110" class="backend-bg category-box" rx="5"/>
    <text x="595" y="150" text-anchor="middle" class="tech-name">API Routes</text>
    <text x="595" y="168" text-anchor="middle" class="tech-desc">Next.js Server</text>
    <text x="595" y="183" text-anchor="middle" class="tech-desc">Routes, HTTP</text>
    <text x="595" y="197" text-anchor="middle" class="tech-desc">Methods, Request</text>
    <text x="595" y="211" text-anchor="middle" class="tech-desc">Processing</text>
    
    <!-- pg Library -->
    <rect x="380" y="255" width="130" height="110" class="backend-bg category-box" rx="5"/>
    <text x="445" y="280" text-anchor="middle" class="tech-name">pg Library</text>
    <text x="445" y="298" text-anchor="middle" class="tech-desc">PostgreSQL Client</text>
    <text x="445" y="313" text-anchor="middle" class="tech-desc">Connection Pooling,</text>
    <text x="445" y="328" text-anchor="middle" class="tech-desc">Query Execution,</text>
    <text x="445" y="342" text-anchor="middle" class="tech-desc">Data Retrieval</text>
    
    <!-- bcryptjs -->
    <rect x="530" y="255" width="130" height="110" class="backend-bg category-box" rx="5"/>
    <text x="595" y="280" text-anchor="middle" class="tech-name">bcryptjs</text>
    <text x="595" y="298" text-anchor="middle" class="tech-desc">Password Hashing,</text>
    <text x="595" y="313" text-anchor="middle" class="tech-desc">Encryption Algorithm,</text>
    <text x="595" y="328" text-anchor="middle" class="tech-desc">Secure Password</text>
    <text x="595" y="342" text-anchor="middle" class="tech-desc">Storage</text>
