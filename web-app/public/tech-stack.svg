    <text x="925" y="183" text-anchor="middle" class="tech-desc">PDF/Word/Excel</text>
    <text x="925" y="197" text-anchor="middle" class="tech-desc">File Uploads,</text>
    <text x="925" y="211" text-anchor="middle" class="tech-desc">Versioning</text>
    
    <!-- Backup & Archiving -->
    <rect x="710" y="255" width="130" height="110" class="database-bg category-box" rx="5"/>
    <text x="775" y="280" text-anchor="middle" class="tech-name">Archive Storage</text>
    <text x="775" y="298" text-anchor="middle" class="tech-desc">Historical Data,</text>
    <text x="775" y="313" text-anchor="middle" class="tech-desc">Soft Delete,</text>
    <text x="775" y="328" text-anchor="middle" class="tech-desc">Retention Policy,</text>
    <text x="775" y="342" text-anchor="middle" class="tech-desc">Restore Capability</text>
    
    <!-- Email Service -->
    <rect x="860" y="255" width="130" height="110" class="database-bg category-box" rx="5"/>
    <text x="925" y="280" text-anchor="middle" class="tech-name">Email Service</text>
    <text x="925" y="298" text-anchor="middle" class="tech-desc">Nodemailer/SMTP,</text>
    <text x="925" y="313" text-anchor="middle" class="tech-desc">Notifications,</text>
    <text x="925" y="328" text-anchor="middle" class="tech-desc">Scheduled Emails,</text>
    <text x="925" y="342" text-anchor="middle" class="tech-desc">Delivery Tracking</text>
  </g>
  
  <!-- TOOLS & UTILITIES LAYER -->
  <g id="tools">
    <!-- Category Header -->
    <rect x="1040" y="75" width="310" height="35" class="tools-bg" rx="5"/>
    <text x="1195" y="100" text-anchor="middle" class="category-title">TOOLS & UTILITIES</text>
    
    <!-- Axios/Fetch -->
    <rect x="1040" y="125" width="100" height="110" class="tools-bg category-box" rx="5"/>
    <text x="1090" y="150" text-anchor="middle" class="tech-name">Fetch API</text>
    <text x="1090" y="168" text-anchor="middle" class="tech-desc">HTTP Requests</text>
    <text x="1090" y="183" text-anchor="middle" class="tech-desc">Client-Server</text>
    <text x="1090" y="197" text-anchor="middle" class="tech-desc">Communication</text>
    <text x="1090" y="211" text-anchor="middle" class="tech-desc">JSON Data</text>
    
    <!-- Lucide Icons -->
    <rect x="1160" y="125" width="100" height="110" class="tools-bg category-box" rx="5"/>
    <text x="1210" y="150" text-anchor="middle" class="tech-name">Lucide Icons</text>
    <text x="1210" y="168" text-anchor="middle" class="tech-desc">Icon Library,</text>
    <text x="1210" y="183" text-anchor="middle" class="tech-desc">SVG Icons,</text>
    <text x="1210" y="197" text-anchor="middle" class="tech-desc">UI Components</text>
    <text x="1210" y="211" text-anchor="middle" class="tech-desc">Customizable</text>
    
