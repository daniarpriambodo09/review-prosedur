    <text x="115" y="168" text-anchor="middle" class="tech-desc">Server & Client</text>
    <text x="115" y="183" text-anchor="middle" class="tech-desc">Components,</text>
    <text x="115" y="197" text-anchor="middle" class="tech-desc">App Router,</text>
    <text x="115" y="211" text-anchor="middle" class="tech-desc">API Routes</text>
    
    <!-- React -->
