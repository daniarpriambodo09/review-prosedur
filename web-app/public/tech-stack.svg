    <text x="265" y="150" text-anchor="middle" class="tech-name">React 18+</text>
    <text x="265" y="168" text-anchor="middle" class="tech-desc">Component-based</text>
    <text x="265" y="183" text-anchor="middle" class="tech-desc">UI Framework,</text>
    <text x="265" y="197" text-anchor="middle" class="tech-desc">Hooks, Suspense</text>
    <text x="265" y="211" text-anchor="middle" class="tech-desc">for Data Fetch</text>
    
    <!-- TypeScript -->
