    <text x="775" y="183" text-anchor="middle" class="tech-desc">ACID Compliance,</text>
    <text x="775" y="197" text-anchor="middle" class="tech-desc">Complex Queries,</text>
    <text x="775" y="211" text-anchor="middle" class="tech-desc">Data Integrity</text>
    
    <!-- File Storage -->
    <rect x="860" y="125" width="130" height="110" class="database-bg category-box" rx="5"/>
