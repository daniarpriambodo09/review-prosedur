<svg viewBox="0 0 1400 850" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <style>
      .main-title { font-size: 28px; font-weight: bold; fill: #1a365d; }
      .category-title { font-size: 14px; font-weight: bold; fill: #fff; }
      .tech-name { font-size: 13px; font-weight: 600; fill: #1a365d; }
      .tech-desc { font-size: 10px; fill: #4a5568; }
      .category-box { stroke-width: 2; }
      .frontend-bg { fill: #fef5e7; stroke: #f39c12; }
      .backend-bg { fill: #e8f5e9; stroke: #27ae60; }
      .database-bg { fill: #fce4ec; stroke: #e91e63; }
      .tools-bg { fill: #e3f2fd; stroke: #1976d2; }
