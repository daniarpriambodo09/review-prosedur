    <text x="115" y="280" text-anchor="middle" class="tech-name">TypeScript</text>
    <text x="115" y="298" text-anchor="middle" class="tech-desc">Type-safe Code,</text>
    <text x="115" y="313" text-anchor="middle" class="tech-desc">Type Definitions,</text>
    <text x="115" y="328" text-anchor="middle" class="tech-desc">Type Checking</text>
    <text x="115" y="342" text-anchor="middle" class="tech-desc">at Compile Time</text>
    
    <!-- Tailwind CSS -->
    <rect x="200" y="255" width="130" height="110" class="frontend-bg category-box" rx="5"/>
    <text x="265" y="280" text-anchor="middle" class="tech-name">Tailwind CSS</text>
    <text x="265" y="298" text-anchor="middle" class="tech-desc">Utility-first CSS,</text>
    <text x="265" y="313" text-anchor="middle" class="tech-desc">Responsive Design,</text>
    <text x="265" y="328" text-anchor="middle" class="tech-desc">Dark Mode,</text>
    <text x="265" y="342" text-anchor="middle" class="tech-desc">Customization</text>
  </g>
  
