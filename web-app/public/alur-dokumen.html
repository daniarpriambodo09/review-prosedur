<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alur Dokumen - Review Prosedur</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            padding: 40px 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #1e40af;
            margin-bottom: 40px;
            font-size: 28px;
        }
        svg {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Alur Lifecycle Dokumen - Review Prosedur</h1>
        <svg viewBox="0 0 1400 700" xmlns="http://www.w3.org/2000/svg" width="100%" style="max-width: 1400px;">
            <!-- Phase 1: Pembuatan Dokumen -->
            <text x="50" y="35" font-size="18" font-weight="bold" fill="#1e40af">1. Pembuatan Dokumen</text>
            
            <rect x="50" y="60" width="100" height="70" rx="8" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
            <text x="100" y="85" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Create</text>
            <text x="100" y="103" font-size="10" fill="white" text-anchor="middle">Dokumen Baru</text>
            
            <path d="M 160 95 L 190 95" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
            
            <rect x="190" y="60" width="100" height="70" rx="8" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
            <text x="240" y="85" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Upload</text>
            <text x="240" y="103" font-size="10" fill="white" text-anchor="middle">File Dokumen</text>
            
            <path d="M 300 95 L 330 95" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
            
            <rect x="330" y="60" width="100" height="70" rx="8" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
            <text x="380" y="85" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Save</text>
            <text x="380" y="103" font-size="10" fill="white" text-anchor="middle">ke Database</text>
            
            <path d="M 440 95 L 470 95" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
            
            <rect x="470" y="60" width="100" height="70" rx="8" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
            <text x="520" y="85" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Log</text>
            <text x="520" y="103" font-size="10" fill="white" text-anchor="middle">Activity</text>
            
            <!-- Status Box for Phase 1 -->
            <rect x="50" y="155" width="520" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
            <text x="310" y="175" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">Status: DRAFT (Menunggu Review PIC)</text>
            <text x="310" y="195" font-size="11" fill="#0369a1" text-anchor="middle">Dokumen tersimpan dan siap untuk review</text>
            
            <!-- Phase 2: Proses Review PIC -->
            <text x="50" y="260" font-size="18" font-weight="bold" fill="#1e40af">2. Proses Review PIC</text>
            
            <rect x="50" y="285" width="100" height="70" rx="8" fill="#10b981" stroke="#047857" stroke-width="2"/>
            <text x="100" y="310" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Create</text>
            <text x="100" y="328" font-size="10" fill="white" text-anchor="middle">Review</text>
            
            <path d="M 160 320 L 190 320" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
            
            <rect x="190" y="285" width="100" height="70" rx="8" fill="#10b981" stroke="#047857" stroke-width="2"/>
            <text x="240" y="310" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Kirim</text>
            <text x="240" y="328" font-size="10" fill="white" text-anchor="middle">Notifikasi</text>
            
            <path d="M 300 320 L 330 320" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
            
            <!-- Decision Diamond -->
            <polygon points="430,285 480,320 430,355 380,320" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
            <text x="430" y="323" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Decision</text>
            
            <!-- Approved Path -->
            <path d="M 480 320 L 540 320" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>
            <text x="510" y="310" font-size="10" fill="#047857" font-weight="bold">Approved ✓</text>
            
            <rect x="540" y="285" width="100" height="70" rx="8" fill="#10b981" stroke="#047857" stroke-width="2"/>
            <text x="590" y="310" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Update</text>
            <text x="590" y="328" font-size="10" fill="white" text-anchor="middle">Status Active</text>
            
            <!-- Rejected Path -->
            <path d="M 430 355 L 430 400 L 590 400 L 590 365" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowhead-red)"/>
            <text x="455" y="380" font-size="10" fill="#991b1b" font-weight="bold">Rejected ✗</text>
            
            <!-- Status Box for Phase 2 -->
            <rect x="50" y="380" width="600" height="50" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
            <text x="350" y="400" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">Status: ACTIVE / REJECTED (Proses Review Selesai)</text>
            <text x="350" y="420" font-size="11" fill="#047857" text-anchor="middle">Dokumen siap distribusi atau perlu perbaikan</text>
            
            <!-- Phase 3: Tracking & Distribusi -->
            <text x="50" y="485" font-size="18" font-weight="bold" fill="#1e40af">3. Tracking & Distribusi</text>
            
            <rect x="50" y="510" width="95" height="70" rx="8" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
            <text x="97.5" y="535" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Update</text>
            <text x="97.5" y="553" font-size="10" fill="white" text-anchor="middle">Status</text>
            
            <path d="M 155 545 L 185 545" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
            
            <rect x="185" y="510" width="95" height="70" rx="8" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
            <text x="232.5" y="535" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Notifikasi</text>
            <text x="232.5" y="553" font-size="10" fill="white" text-anchor="middle">User</text>
            
            <path d="M 290 545 L 320 545" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
            
            <rect x="320" y="510" width="95" height="70" rx="8" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
            <text x="367.5" y="535" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Log</text>
            <text x="367.5" y="553" font-size="10" fill="white" text-anchor="middle">Activity</text>
            
            <path d="M 425 545 L 455 545" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
            
            <rect x="455" y="510" width="95" height="70" rx="8" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
            <text x="502.5" y="535" font-size="11" font-weight="bold" fill="white" text-anchor="middle">User</text>
            <text x="502.5" y="553" font-size="10" fill="white" text-anchor="middle">Access</text>
            
            <path d="M 560 545 L 590 545" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
            
            <rect x="590" y="510" width="95" height="70" rx="8" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
            <text x="637.5" y="535" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Track</text>
            <text x="637.5" y="553" font-size="10" fill="white" text-anchor="middle">Usage</text>
            
            <!-- Status Box for Phase 3 -->
            <rect x="50" y="605" width="635" height="50" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
            <text x="367.5" y="625" font-size="13" font-weight="bold" fill="#5b21b6" text-anchor="middle">Status: DISTRIBUTED (Dokumen Aktif & Terdistribusi)</text>
            <text x="367.5" y="645" font-size="11" fill="#6d28d9" text-anchor="middle">Pengguna dapat mengakses dan menggunakan dokumen</text>
            
            <!-- Phase 4: Pengarsipan -->
            <text x="750" y="35" font-size="18" font-weight="bold" fill="#1e40af">4. Pengarsipan Dokumen</text>
            
            <rect x="750" y="60" width="110" height="70" rx="8" fill="#ec4899" stroke="#be185d" stroke-width="2"/>
            <text x="805" y="85" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Cek</text>
            <text x="805" y="103" font-size="10" fill="white" text-anchor="middle">Tanggal Arsip</text>
            
            <path d="M 870 95 L 900 95" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
            
            <rect x="900" y="60" width="110" height="70" rx="8" fill="#ec4899" stroke="#be185d" stroke-width="2"/>
            <text x="955" y="85" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Archive</text>
            <text x="955" y="103" font-size="10" fill="white" text-anchor="middle">Dokumen</text>
            
            <path d="M 1020 95 L 1050 95" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
            
            <rect x="1050" y="60" width="110" height="70" rx="8" fill="#ec4899" stroke="#be185d" stroke-width="2"/>
            <text x="1105" y="85" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Simpan</text>
            <text x="1105" y="103" font-size="10" fill="white" text-anchor="middle">Metadata</text>
            
            <path d="M 1170 95 L 1200 95" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
            
            <rect x="1200" y="60" width="110" height="70" rx="8" fill="#ec4899" stroke="#be185d" stroke-width="2"/>
            <text x="1255" y="85" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Hide</text>
            <text x="1255" y="103" font-size="10" fill="white" text-anchor="middle">dari Active</text>
            
            <!-- Status Box for Phase 4 -->
            <rect x="750" y="155" width="560" height="50" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
            <text x="1030" y="175" font-size="13" font-weight="bold" fill="#831843" text-anchor="middle">Status: ARCHIVED (Dokumen Diarsipkan)</text>
            <text x="1030" y="195" font-size="11" fill="#be185d" text-anchor="middle">Dokumen disimpan di archival system dengan retention policy</text>
            
            <!-- Timeline on the side -->
            <text x="750" y="260" font-size="16" font-weight="bold" fill="#374151">Durasi Lifecycle</text>
            
            <rect x="750" y="285" width="560" height="250" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
            
            <!-- Timeline items -->
            <circle cx="770" cy="310" r="6" fill="#3b82f6"/>
            <text x="790" y="315" font-size="12" font-weight="bold" fill="#1f2937">Fase 1: Draft</text>
            <text x="790" y="333" font-size="11" fill="#6b7280">⏱ 1-7 hari</text>
            <text x="790" y="350" font-size="10" fill="#6b7280">Pengguna membuat dan upload dokumen</text>
            
            <circle cx="770" cy="380" r="6" fill="#10b981"/>
            <text x="790" y="385" font-size="12" font-weight="bold" fill="#1f2937">Fase 2: Review PIC</text>
            <text x="790" y="403" font-size="11" fill="#6b7280">⏱ 3-14 hari</text>
            <text x="790" y="420" font-size="10" fill="#6b7280">PIC melakukan review dan membuat keputusan</text>
            
            <circle cx="770" cy="450" r="6" fill="#8b5cf6"/>
            <text x="790" y="455" font-size="12" font-weight="bold" fill="#1f2937">Fase 3: Distribusi</text>
            <text x="790" y="473" font-size="11" fill="#6b7280">⏱ 1 hari - ongoing</text>
            <text x="790" y="490" font-size="10" fill="#6b7280">Dokumen didistribusi ke pengguna & di-track</text>
            
            <circle cx="770" cy="520" r="6" fill="#ec4899"/>
            <text x="790" y="525" font-size="12" font-weight="bold" fill="#1f2937">Fase 4: Arsip</text>
            <text x="790" y="543" font-size="11" fill="#6b7280">⏱ Otomatis sesuai retention</text>
            <text x="790" y="560" font-size="10" fill="#6b7280">Dokumen diarsipkan berdasarkan policy</text>
            
            <!-- Arrow Marker Definitions -->
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <polygon points="0 0, 10 5, 0 10" fill="#6b7280"/>
                </marker>
                <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <polygon points="0 0, 10 5, 0 10" fill="#10b981"/>
                </marker>
                <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <polygon points="0 0, 10 5, 0 10" fill="#ef4444"/>
                </marker>
            </defs>
        </svg>
    </div>
</body>
</html>
